name: Frontend CI

on:
  push:
    paths:
      - "fermentbox-frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"
  pull_request:
    paths:
      - "fermentbox-frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "Makefile"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fermentbox-frontend

    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: fermentbox-frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: API contract check
        run: yarn api:check

      - name: Verify generated API artifacts are committed
        run: yarn api:verify-fresh

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build frontend
        run: yarn build
