name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: make
      run: git clone https://github.com/SmingHub/Sming.git
    - name: make
      run: |
        export SMING_HOME=$PWD/Sming
        cd fermentbox-backend 
        make

